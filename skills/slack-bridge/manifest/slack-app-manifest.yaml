display_information:
  name: Grok Bot
  description: Chat with your Grok Bot assistant from Slack.
  background_color: "#111827"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Grok Bot
    always_online: true
  agent_view:
    agent_description: Chat with your Grok Bot assistant from Slack.
    suggested_prompts:
      - title: "What can you do?"
        message: "What can you help me with here in Slack?"
      - title: Summarize this channel
        message: Summarize the recent discussion in the channel I'm looking at.
      - title: Draft a reply
        message: Help me draft a reply to the latest message.
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - assistant:write
      - channels:history
      - chat:write
      - groups:history
      - im:history
      - im:read
      - im:write
      - mpim:history
      - reactions:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - app_context_changed
      - agent_session_stopped
      - agent_session_title_changed
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
